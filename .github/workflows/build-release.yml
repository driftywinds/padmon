name: Build and release padmon

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Show .NET SDK
        run: dotnet --info

      - name: Restore
        run: dotnet restore Padmon.sln --configfile NuGet.Config

      - name: Build
        run: >
          dotnet build Padmon.sln
          --configuration Release
          --no-restore
          --property:Platform=x64
          --property:UseSharedCompilation=false
          --maxcpucount:1

      - name: Publish portable unpackaged app
        run: >
          dotnet publish src/Padmon.App/Padmon.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --property:Platform=x64
          --property:WindowsAppSDKSelfContained=true
          --property:UseSharedCompilation=false
          --output artifacts/padmon-win-x64

      - name: Verify published app
        shell: pwsh
        run: |
          $exe = "artifacts/padmon-win-x64/Padmon.exe"
          $pri = "artifacts/padmon-win-x64/Padmon.pri"
          if (-not (Test-Path $exe)) { throw "Missing $exe" }
          if (-not (Test-Path $pri)) { throw "Missing $pri (WinUI resources are required at startup)" }

      - name: Add README to the portable artifact
        shell: pwsh
        run: Copy-Item README.md artifacts/padmon-win-x64/README.md

      - name: Create release archive
        shell: pwsh
        run: Compress-Archive -Path artifacts/padmon-win-x64/* -DestinationPath artifacts/padmon-win-x64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: padmon-win-x64
          path: artifacts/padmon-win-x64.zip
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/padmon-win-x64.zip
          generate_release_notes: true
          draft: false
          prerelease: false
