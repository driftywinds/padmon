name: Build and release padmon

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version tag to release, for example v0.2.0. Leave empty to build artifacts only."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $tag = ""
          $appVersion = "0.1.0"

          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $requested = "${{ inputs.version }}".Trim()

            if ($requested) {
              if ($requested -notmatch '^[vV]') {
                $requested = "v$requested"
              }
              else {
                $requested = "v" + $requested.Substring(1)
              }

              if ($requested -notmatch '^v\d+\.\d+\.\d+([-.].*)?$') {
                throw "Version must look like v1.2.3 or 1.2.3."
              }

              $tag = $requested
              $appVersion = $tag.Substring(1)
            }
          }
          elseif ("${{ github.ref }}" -like "refs/tags/v*") {
            $tag = "${{ github.ref_name }}"
            $appVersion = $tag.Substring(1)
          }

          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          "APP_VERSION=$appVersion" >> $env:GITHUB_ENV
          "release_tag=$tag" >> $env:GITHUB_OUTPUT

          Write-Host "Release tag: '$tag'"
          Write-Host "App version: '$appVersion'"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Show .NET SDK
        run: dotnet --info

      - name: Restore
        run: dotnet restore Padmon.sln --configfile NuGet.Config

      - name: Build
        run: >
          dotnet build Padmon.sln
          --configuration Release
          --no-restore
          --property:Platform=x64
          --property:Version=${{ env.APP_VERSION }}
          --property:UseSharedCompilation=false
          --maxcpucount:1

      - name: Publish portable unpackaged app
        run: >
          dotnet publish src/Padmon.App/Padmon.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --property:Platform=x64
          --property:Version=${{ env.APP_VERSION }}
          --property:WindowsAppSDKSelfContained=true
          --property:UseSharedCompilation=false
          --output artifacts/padmon-win-x64

      - name: Verify published app
        shell: pwsh
        run: |
          $exe = "artifacts/padmon-win-x64/Padmon.exe"
          $pri = "artifacts/padmon-win-x64/Padmon.pri"
          if (-not (Test-Path $exe)) { throw "Missing $exe" }
          if (-not (Test-Path $pri)) { throw "Missing $pri (WinUI resources are required at startup)" }

      - name: Add README to the portable artifact
        shell: pwsh
        run: Copy-Item README.md artifacts/padmon-win-x64/README.md

      - name: Pack app as portable payload (internal, not uploaded)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/payload | Out-Null
          Compress-Archive -Path artifacts/padmon-win-x64/* -DestinationPath artifacts/payload/payload.zip -Force

      - name: Publish single-file portable launcher
        run: >
          dotnet publish src/Padmon.Portable/Padmon.Portable.csproj
          --configuration Release
          --runtime win-x64
          --property:PadmonPayload=${{ github.workspace }}/artifacts/payload/payload.zip
          --property:UseSharedCompilation=false
          --output artifacts/padmon-portable

      - name: Verify portable exe
        shell: pwsh
        run: |
          $exe = "artifacts/padmon-portable/Padmon-portable.exe"
          if (-not (Test-Path $exe)) { throw "Missing $exe" }
          "{0:N1} MB" -f ((Get-Item $exe).Length / 1MB)

      # upload-artifact zips whatever it is given, so hand it the raw files.
      # Uploading a .zip here is what produced a zip inside a zip.
      - name: Upload folder build
        uses: actions/upload-artifact@v4
        with:
          name: padmon-win-x64
          path: artifacts/padmon-win-x64/
          if-no-files-found: error

      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: padmon-portable
          path: artifacts/padmon-portable/Padmon-portable.exe
          if-no-files-found: error

      # Releases get the one zip plus the bare portable exe (no nested archives).
      - name: Create release zip
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        shell: pwsh
        run: Compress-Archive -Path artifacts/padmon-win-x64/* -DestinationPath artifacts/padmon-win-x64.zip -Force

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: |
            artifacts/padmon-win-x64.zip
            artifacts/padmon-portable/Padmon-portable.exe
          generate_release_notes: true
          draft: false
          prerelease: false